name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to build and upload binaries for"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to build and upload binaries for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          BIN=linecheck
          [[ "$TARGET" == *windows* ]] && BIN=linecheck.exe
          ARCHIVE="linecheck-$TAG-$TARGET"
          mkdir "$ARCHIVE"
          cp "target/$TARGET/release/$BIN" LICENSE README.md "$ARCHIVE/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$ARCHIVE.zip" "$ARCHIVE"
          else
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$TAG" linecheck-"$TAG"-"$TARGET".* --clobber
